    <radialGradient id="spot" cx=".5" cy="0" r=".75"><stop offset="0" stop-color="#d9a441" stop-opacity=".32"/><stop offset=".6" stop-color="#d9a441" stop-opacity=".06"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/></radialGradient>
